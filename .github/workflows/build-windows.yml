name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: pyinstaller packaging/HashCalc_CPU.spec

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/HashCalc_CPU/* -DestinationPath HashCalc_CPU_Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashCalc_CPU_Windows
          path: HashCalc_CPU_Windows.zip

      - name: Attach archive to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HashCalc_CPU_Windows.zip
