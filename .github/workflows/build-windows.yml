name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name HashCalc_CPU `
            src/hashcalc_cpu.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\HashCalc_CPU.exe")) {
            throw "HashCalc_CPU.exe was not created"
          }

      - name: Create release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\HashCalc_CPU.exe release\HashCalc_CPU.exe
          Compress-Archive -Path release\HashCalc_CPU.exe -DestinationPath release\HashCalc_CPU_Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashCalc_CPU_Windows
          path: release/HashCalc_CPU_Windows.zip

      - name: Attach archive to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/HashCalc_CPU_Windows.zip
